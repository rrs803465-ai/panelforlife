{% extends "base.html" %}
{% block title %}Forgot Password — Panel4Life{% endblock %}
{% block body %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;">
  <div style="width:100%;max-width:380px;">
    <div style="text-align:center;margin-bottom:2rem;">
      <div style="font-size:.85rem;color:var(--text-2);">Reset your password</div>
    </div>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <div class="card">
      <form method="post">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input name="username" class="form-input" placeholder="your_username" autofocus>
        </div>
        <div class="form-group">
          <label class="form-label">Recovery code</label>
          <input name="code" class="form-input" placeholder="XXXXXX" style="text-transform:uppercase;letter-spacing:.1em;font-family:var(--mono);">
        </div>
        <button type="submit" class="btn btn-primary btn-full">Verify</button>
      </form>
    </div>
    <div style="text-align:center;margin-top:1rem;font-size:.8rem;">
      <a href="{{ url_for('login') }}" style="color:var(--text-2);">Back to sign in</a>
    </div>
  </div>
</div>
{% endblock %}
