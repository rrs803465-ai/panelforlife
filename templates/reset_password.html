{% extends "base.html" %}
{% block title %}New Password — Panel4Life{% endblock %}
{% block body %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;">
  <div style="width:100%;max-width:380px;">
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <div class="card">
      <h2 style="font-size:1rem;font-weight:600;margin-bottom:1.25rem;">Set a new password</h2>
      <form method="post">
        <div class="form-group">
          <label class="form-label">New password</label>
          <input name="password" type="password" class="form-input" placeholder="min 6 characters" autofocus>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Update password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
